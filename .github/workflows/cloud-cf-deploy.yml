name: Cloud CF Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to inspect
        required: true
        default: staging
        type: choice
        options: [staging, production]
      force:
        description: Unused compatibility input
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  tail:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g wrangler@4.61.1
      - name: Tail staging worker for one live diagnostic turn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 150s wrangler tail eliza-cloud-api-staging --format json | tee /tmp/worker-tail.jsonl
          exit_code=${PIPESTATUS[0]}
          echo "tail_exit=$exit_code"
          test "$exit_code" = 0 -o "$exit_code" = 124
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-worker-tail
          path: /tmp/worker-tail.jsonl
