name: Cloud CF Deploy
on:
  workflow_dispatch:
    inputs:
      environment: {required: true, default: staging, type: choice, options: [staging, production]}
      force: {required: false, default: false, type: boolean}
permissions: {contents: read}
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: Exact server-held bridge request against held live agent
        env:
          ELIZACLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
        run: |
          AUTH="Bearer $ELIZACLOUD_API_KEY"
          URL="https://api-staging.elizacloud.ai/api/v1/eliza/agents/66db3a1b-ac2d-40cd-beda-53f0cb21eb9e/api/conversations/f07266f9-b6b6-4a0b-9724-10ae33770bee/messages/stream"
          curl -sS -o /tmp/body -w 'status=%{http_code}\n' -X POST "$URL" -H "Authorization: $AUTH" -H "X-Service-Key: $AUTH" -H "X-Eliza-Organization-Id: 41ac20f4-b799-40b1-a487-2d6a748afe92" -H "X-Eliza-User-Id: eedbba1d-0afe-4da6-8a9d-7f7e5b8354b4" -H "X-Eliza-Agent-Id: 66db3a1b-ac2d-40cd-beda-53f0cb21eb9e" -H "X-Eliza-Conversation-Id: f07266f9-b6b6-4a0b-9724-10ae33770bee" -H 'X-Eliza-Voice-Trace-Id: diag-held' -H 'Accept: text/event-stream' -H 'Content-Type: application/json' --data '{"text":"Reply exactly: bridge held ok"}'
          printf 'body='; head -c 1000 /tmp/body; echo
