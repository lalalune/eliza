name: Chat Latency Telemetry

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Eliza Cloud gateway environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      repeats:
        description: Warm samples per target
        required: true
        default: "10"
        type: choice
        options:
          - "3"
          - "10"
          - "30"
      expected_gateway_sha:
        description: Exact 40-character commit expected from /api/health
        required: true
        type: string

concurrency:
  group: chat-latency-telemetry-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Cerebras direct + Eliza Cloud
    if: >-
      (inputs.environment == 'staging' && github.ref == 'refs/heads/develop') ||
      (inputs.environment == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      CEREBRAS_CHAT_LATENCY_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      ELIZA_CLOUD_CHAT_LATENCY_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
      ELIZA_CLOUD_CHAT_LATENCY_BASE_URL: ${{ inputs.environment == 'production' && 'https://api.elizacloud.ai' || 'https://api-staging.elizacloud.ai' }}
      ELIZA_GATEWAY_DEPLOY_SHA: ${{ inputs.expected_gateway_sha }}
      REPORT_PATH: reports/chat-latency-${{ inputs.environment }}.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.15.0"

      - name: Bind checkout to deployed gateway
        env:
          EXPECTED_GATEWAY_SHA: ${{ inputs.expected_gateway_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const expected = process.env.EXPECTED_GATEWAY_SHA ?? "";
          const checkout = process.env.GITHUB_SHA ?? "";
          if (!/^[a-f0-9]{40}$/.test(expected)) {
            throw new Error("expected_gateway_sha must be a lowercase 40-character commit");
          }
          if (checkout !== expected) {
            throw new Error(`Checkout ${checkout || "<missing>"} does not match deployed gateway ${expected}`);
          }
          NODE

      - name: Verify deployed gateway before measurement
        env:
          EXPECTED_GATEWAY_SHA: ${{ inputs.expected_gateway_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const response = await fetch(
            process.env.ELIZA_CLOUD_CHAT_LATENCY_BASE_URL + "/api/health",
            {
              headers: { "user-agent": "eliza-chat-latency/1.0" },
              signal: AbortSignal.timeout(30_000),
            },
          );
          if (!response.ok) throw new Error(`Gateway health returned HTTP ${response.status}`);
          const health = await response.json();
          if (health?.commit !== process.env.EXPECTED_GATEWAY_SHA) {
            throw new Error(
              `Gateway serves ${health?.commit ?? "<missing>"}, expected ${process.env.EXPECTED_GATEWAY_SHA}`,
            );
          }
          NODE

      - name: Measure Gemma streaming
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node packages/scripts/cloud/chat-latency.mjs \
            --target paired \
            --direct-base-url https://api.cerebras.ai \
            --gateway-base-url "$ELIZA_CLOUD_CHAT_LATENCY_BASE_URL" \
            --direct-api-key-env CEREBRAS_CHAT_LATENCY_API_KEY \
            --gateway-api-key-env ELIZA_CLOUD_CHAT_LATENCY_API_KEY \
            --repeat "${{ inputs.repeats }}" \
            --idle-ms 0 \
            --pair-interval-ms 0 \
            --seed "${{ github.run_id }}-${{ github.run_attempt }}" \
            --case gemma-4-31b@omit@512 \
            | tee "$REPORT_PATH"

      - name: Verify deployed gateway after measurement
        if: always()
        env:
          EXPECTED_GATEWAY_SHA: ${{ inputs.expected_gateway_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const response = await fetch(
            process.env.ELIZA_CLOUD_CHAT_LATENCY_BASE_URL + "/api/health",
            {
              headers: { "user-agent": "eliza-chat-latency/1.0" },
              signal: AbortSignal.timeout(30_000),
            },
          );
          if (!response.ok) throw new Error(`Gateway health returned HTTP ${response.status}`);
          const health = await response.json();
          if (health?.commit !== process.env.EXPECTED_GATEWAY_SHA) {
            throw new Error(
              `Gateway changed during measurement: ${health?.commit ?? "<missing>"}`,
            );
          }
          NODE

      - name: Summarize telemetry
        if: always() && hashFiles(env.REPORT_PATH) != ''
        run: |
          node --input-type=module - "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          import { readFileSync } from "node:fs";
          import { summarizeLatencyRecords } from "./packages/scripts/cloud/chat-latency.mjs";

          const records = readFileSync(process.argv[2], "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const summary = summarizeLatencyRecords(records);

          console.log(`Checkout: ${process.env.GITHUB_SHA ?? "unknown"}`);
          console.log("");
          console.log(`Gateway deployment: ${process.env.ELIZA_GATEWAY_DEPLOY_SHA ?? "unknown"}`);
          console.log("");
          console.log("| Target | Samples | Failures | Headers p50 | First token p50 | Total p50 |");
          console.log("| --- | ---: | ---: | ---: | ---: | ---: |");
          for (const row of summary) {
            console.log(
              `| ${row.target} | ${row.samples} | ${row.failures} | ${row.responseHeadersMs.p50 ?? "n/a"} ms | ${row.firstTokenMs.p50 ?? "n/a"} ms | ${row.totalMs.p50 ?? "n/a"} ms |`,
            );
          }
          NODE

      - name: Upload telemetry
        if: always() && hashFiles(env.REPORT_PATH) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-latency-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 14
