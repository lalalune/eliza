name: Benchmark Bridge Tests

# CI fan-out fix: the PR-scoped concurrency from #14069 fell back to
# github.run_id on push, so every develop push got a unique group and
# nothing ever superseded. A 37-merge wave queued thousands of push runs
# and starved the self-hosted fleet. Fall back to github.ref (all develop
# pushes share a group) and cancel superseded runs on push too. PR behavior
# is unchanged (pull_request.number still wins the key); merge_group and
# schedule events are not in the cancel set, so the merge queue and nightly
# runs always complete.
concurrency:
  group: benchmark-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/lifeops-bench/**"
      - "packages/benchmarks/**"
      - "packages/agent/**"
      - "packages/core/**"
      - "packages/shared/**"
      - "packages/cloud/routing/**"
      - "packages/cloud/sdk/**"
      - "plugins/plugin-groq/**"
      - "plugins/plugin-local-inference/**"
      - ".github/actions/setup-bun-workspace/**"
      - ".github/ci-bun-version.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/benchmark-tests.yml"
      - ".github/workflows/benchmark-orchestrator-scheduled.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/lifeops-bench/**"
      - "packages/benchmarks/**"
      - "packages/agent/**"
      - "packages/core/**"
      - "packages/shared/**"
      - "packages/cloud/routing/**"
      - "packages/cloud/sdk/**"
      - "plugins/plugin-groq/**"
      - "plugins/plugin-local-inference/**"
      - ".github/actions/setup-bun-workspace/**"
      - ".github/ci-bun-version.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/benchmark-tests.yml"
      - ".github/workflows/benchmark-orchestrator-scheduled.yml"
  workflow_dispatch:

env:
  NODE_NO_WARNINGS: "1"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'false' && '["ubuntu-24.04"]' || '["self-hosted","hetzner-robot"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: benchmark-tests
            runtime: bun
            command: bunx vitest run --config vitest.config.ts --root packages/lifeops-bench
          - lane: benchmark-lint
            runtime: bun
            command: bunx @biomejs/biome check packages/lifeops-bench/src
          - lane: benchmark-ci-coverage
            runtime: python
            command: PYTHONPATH=packages python -m pytest packages/benchmarks/tests/test_ci_coverage.py -q

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: false

      - name: Setup Node.js
        if: matrix.runtime == 'bun'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: false

      - name: Setup workspace dependencies
        if: matrix.runtime == 'bun'
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: "1.3.14" # pinned: floating canary writes lockfileVersion 2 and breaks --frozen-lockfile (#11184/#9454); packageManager bun@1.4.0-canary.1 is unresolvable (GH+npm 404)
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          install-native-deps: "false"

      - name: Setup Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install benchmark test dependencies
        if: matrix.runtime == 'python'
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run ${{ matrix.lane }} lane
        env:
          CI: "true"
        run: ${{ matrix.command }}
